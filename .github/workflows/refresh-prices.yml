name: Refresh card prices

on:
  schedule:
    # TCGCSV rebuilds its files once a day around 20:00 UTC; run after that.
    - cron: "33 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-prices:
    outputs:
      problem: ${{ steps.refresh.outputs.problem }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh prices
        id: refresh
        run: node scripts/refresh-prices.mjs

      - name: Commit price updates
        run: |
          # All of docs/, like the generated-pages check in checks.yml, so new generated page types are never left out.
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Refresh card prices"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  # Deploying is a job of its own, as in GitHub's Pages starter workflows: it starts once the build job has finished,
  # by which time GitHub lists the upload. Deploying from the same job, a second after the upload, failed with "No
  # artifacts named github-pages" on every deploy from Nov 23 2026 (actions/deploy-pages#451). One more try after a
  # minute stays as a backstop. If a deploy still fails, use "Re-run failed jobs" (this job only, same upload), not
  # "Re-run all jobs", which uploads a second copy and fails with "Multiple artifacts".
  deploy:
    needs: refresh-prices
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (second try)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # After publishing whatever did refresh: a red run (and GitHub's email) when TCGCSV was unreachable or too
      # many cards failed. The run summary says what went wrong. Here, not in the build job, so it never blocks the deploy.
      - name: Report refresh problems
        if: needs.refresh-prices.outputs.problem == 'true'
        run: |
          echo "::error::The price refresh had problems. See the run summary."
          exit 1
