name: Refresh card prices

on:
  schedule:
    # TCGCSV rebuilds its files once a day around 20:00 UTC; run after that.
    - cron: "33 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-prices:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh prices
        id: refresh
        run: node scripts/refresh-prices.mjs

      - name: Commit price updates
        run: |
          # All of docs/, like the generated-pages check in checks.yml, so new generated page types are never left out.
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Refresh card prices"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # After committing whatever did refresh: a red run (and GitHub's email) when TCGCSV was unreachable
      # or too many cards failed. The run summary says what went wrong.
      - name: Report refresh problems
        if: steps.refresh.outputs.problem == 'true'
        run: |
          echo "::error::The price refresh had problems. See the run summary."
          exit 1
