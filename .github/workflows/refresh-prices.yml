name: Refresh card prices

on:
  schedule:
    # TCGCSV rebuilds its files once a day around 20:00 UTC; run after that.
    - cron: "33 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  # The deploy steps list this run's uploads to find the site (see "Wait for the upload to be listed").
  actions: read
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-prices:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh prices
        id: refresh
        run: node scripts/refresh-prices.mjs

      - name: Commit price updates
        run: |
          # All of docs/, like the generated-pages check in checks.yml, so new generated page types are never left out.
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Refresh card prices"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      # deploy-pages can ask for the upload a moment before GitHub lists it, and then fails with "No artifacts named
      # github-pages" (every deploy from Nov 23 2026; actions/deploy-pages#451). Wait until it's listed, then deploy,
      # and try once more after a minute if that still fails. Never use "Re-run jobs" on a failed deploy: it uploads a
      # second copy and fails with "Multiple artifacts"; start a new run instead.
      - name: Wait for the upload to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "${count:-0}" -ge 1 ]; then echo "Listed after about $(( (attempt - 1) * 5 )) s."; exit 0; fi
            sleep 5
          done
          echo "::warning::The github-pages upload still isn't listed after 3 minutes; deploying anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (second try)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # After committing whatever did refresh: a red run (and GitHub's email) when TCGCSV was unreachable
      # or too many cards failed. The run summary says what went wrong.
      - name: Report refresh problems
        if: steps.refresh.outputs.problem == 'true'
        run: |
          echo "::error::The price refresh had problems. See the run summary."
          exit 1
