# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  # The deploy steps list this run's uploads to find the site (see "Wait for the upload to be listed").
  actions: read
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the public site folder as the web root
          path: 'docs'
      # deploy-pages can ask for the upload a moment before GitHub lists it, and then fails with "No artifacts named
      # github-pages" (every deploy from Nov 23 2026; actions/deploy-pages#451). Wait until it's listed, then deploy,
      # and try once more after a minute if that still fails. Never use "Re-run jobs" on a failed deploy: it uploads a
      # second copy and fails with "Multiple artifacts"; start a new run instead.
      - name: Wait for the upload to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "${count:-0}" -ge 1 ]; then echo "Listed after about $(( (attempt - 1) * 5 )) s."; exit 0; fi
            sleep 5
          done
          echo "::warning::The github-pages upload still isn't listed after 3 minutes; deploying anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (second try)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
